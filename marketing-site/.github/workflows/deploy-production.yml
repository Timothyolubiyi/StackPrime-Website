name: Deploy — Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "README.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy source to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "."
          target: "/opt/stackprime-marketing-site/app"
          overwrite: true
          port: 22
          timeout: 2m
          command_timeout: 10m

      - name: Build and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEXT_PUBLIC_SITE_URL: https://stackprimeconsulting.com.ng
          NEXT_PUBLIC_ASSETS_CDN_URL: https://cdn.stackprimeconsulting.com.ng
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_DOMAIN: https://accounts.zoho.com
          ZOHO_CRM_API_DOMAIN: https://www.zohoapis.com
          ZOHO_CAMPAIGNS_LIST_KEY: ${{ secrets.ZOHO_CAMPAIGNS_LIST_KEY }}
          ZOHO_AUTHORIZATION_CODE: ${{ secrets.ZOHO_AUTHORIZATION_CODE }}
          ZOHO_NOTIFICATION_EMAIL: info@stackprimeconsulting.com.ng
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/stackprime-marketing-site/app

            # Create .env file from environment variables
            cat > .env << ENVFILE
            NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_ASSETS_CDN_URL=$NEXT_PUBLIC_ASSETS_CDN_URL
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=$NEXT_PUBLIC_RECAPTCHA_SITE_KEY
            ZOHO_CLIENT_ID=$ZOHO_CLIENT_ID
            ZOHO_CLIENT_SECRET=$ZOHO_CLIENT_SECRET
            ZOHO_REFRESH_TOKEN=$ZOHO_REFRESH_TOKEN
            ZOHO_ACCOUNTS_DOMAIN=$ZOHO_ACCOUNTS_DOMAIN
            ZOHO_CRM_API_DOMAIN=$ZOHO_CRM_API_DOMAIN
            ZOHO_CAMPAIGNS_LIST_KEY=$ZOHO_CAMPAIGNS_LIST_KEY
            ZOHO_AUTHORIZATION_CODE=$ZOHO_AUTHORIZATION_CODE
            ZOHO_NOTIFICATION_EMAIL=$ZOHO_NOTIFICATION_EMAIL
            RECAPTCHA_SECRET_KEY=$RECAPTCHA_SECRET_KEY
            ENVFILE

            echo "✓ Created .env file"
            docker compose build
            docker compose up -d
            docker image prune -f
            echo "Deploy completed at $(date)"

      - name: Verify health (with retries)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            echo "Waiting for application to be ready..."
            for i in {1..30}; do
              if curl -sf https://stackprimeconsulting.com.ng/api/health >/dev/null 2>&1; then
                echo "✓ Health check passed"
                exit 0
              fi
              echo "  Attempt $i/30 — waiting..."
              sleep 2
            done
            echo "✗ Health check failed after 60 seconds"
            docker compose logs
            exit 1