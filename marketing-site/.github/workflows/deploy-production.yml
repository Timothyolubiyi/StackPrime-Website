name: Deploy — Production

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "README.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy source to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "."
          target: "/opt/stackprime-marketing-site/app"
          rm: true
          overwrite: true
          timeout: 60s

      - name: Build and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/stackprime-marketing-site/app
            docker compose build
            docker compose up -d
            docker image prune -f
            echo "Deploy completed at $(date)"

      - name: Verify health (with retries)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            echo "Waiting for application to be ready..."
            for i in {1..30}; do
              if curl -sf https://stackprimeconsulting.com.ng/api/health >/dev/null 2>&1; then
                echo "✓ Health check passed"
                exit 0
              fi
              echo "  Attempt $i/30 — waiting..."
              sleep 2
            done
            echo "✗ Health check failed after 60 seconds"
            docker compose logs
            exit 1