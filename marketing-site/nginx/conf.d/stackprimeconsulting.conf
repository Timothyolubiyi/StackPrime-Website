# Reverse proxy + TLS termination for the StackPrime marketing site.
# Domain names are templated at deploy time by scripts/render-nginx-conf.sh
# (swaps ${SITE_DOMAIN} for stackprimeconsulting.com.ng in production or
# staging.stackprimeconsulting.com.ng in staging) — committed here with the
# production domain as the default.

server {
    listen 80;
    server_name stackprimeconsulting.com.ng www.stackprimeconsulting.com.ng;

    # Certbot ACME challenge path — must stay on plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name stackprimeconsulting.com.ng www.stackprimeconsulting.com.ng;

    ssl_certificate     /etc/letsencrypt/live/stackprimeconsulting.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stackprimeconsulting.com.ng/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://marketing-site:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/health {
        proxy_pass http://marketing-site:3000/api/health;
        access_log off;
    }
}
