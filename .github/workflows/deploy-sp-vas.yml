name: Deploy — SP VAS

on:
  push:
    branches: [main]
    paths:
      - "sp-vas/service/**"
      - "sp-vas/deploy/docker-compose.yml"
      - "sp-vas/deploy/nginx/vas.conf"
      - ".github/workflows/deploy-sp-vas.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy SP VAS source to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "sp-vas/service,sp-vas/deploy/docker-compose.yml,sp-vas/deploy/nginx/vas.conf"
          target: "/opt/sp-vas/app"
          strip_components: 1
          rm: true
          overwrite: true

      - name: Deploy SP VAS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e

            echo "=== Preparing SP VAS deployment ==="

            docker network inspect shared_nginx_net >/dev/null 2>&1 || \
              docker network create shared_nginx_net

            if [ ! -f /opt/sp-vas/.env ]; then
              echo "ERROR: /opt/sp-vas/.env does not exist."
              exit 1
            fi

            cd /opt/sp-vas

            mkdir -p deploy

            cp app/deploy/docker-compose.yml \
              /opt/sp-vas/deploy/docker-compose.yml

            echo "=== Validating Compose configuration ==="

            docker compose \
              -f /opt/sp-vas/deploy/docker-compose.yml \
              config >/dev/null

            echo "=== Building SP VAS ==="

            docker compose \
              -f /opt/sp-vas/deploy/docker-compose.yml \
              build sp-vas

            echo "=== Starting SP VAS ==="

            docker compose \
              -f /opt/sp-vas/deploy/docker-compose.yml \
              up -d --no-deps sp-vas

            echo "=== Waiting for SP VAS health ==="

            for i in $(seq 1 30); do
              STATUS=$(docker inspect \
                -f '{{.State.Health.Status}}' \
                sp-vas 2>/dev/null || true)

              echo "Health status: ${STATUS}"

              if [ "${STATUS}" = "healthy" ]; then
                echo "SP VAS is healthy."
                break
              fi

              if [ "${STATUS}" = "unhealthy" ]; then
                echo "SP VAS became unhealthy."
                docker logs --tail 100 sp-vas || true
                exit 1
              fi

              sleep 5
            done

            STATUS=$(docker inspect \
              -f '{{.State.Health.Status}}' \
              sp-vas 2>/dev/null || true)

            if [ "${STATUS}" != "healthy" ]; then
              echo "SP VAS did not become healthy within the expected time."
              docker logs --tail 100 sp-vas || true
              exit 1
            fi

            echo "=== SP VAS deployment completed ==="
