name: Deploy — Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment bundle
        shell: bash
        run: |
          set -e

          rm -rf .deploy
          mkdir -p .deploy/docker

          cp -a docker/Dockerfile .deploy/docker/
          cp -a docker-compose.yml .deploy/
          cp -a marketing-site .deploy/

          echo "===== Deployment bundle ====="
          du -sh .deploy
          find .deploy -maxdepth 2 -type f | sort | head -50

      - name: Copy deployment bundle to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: ".deploy/*"
          target: "/opt/stackprime-marketing-site/app"
          port: 22
          overwrite: true
          timeout: 120s
          command_timeout: 25m
          strip_components: 1

      - name: Create production environment file
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e

            cat > /opt/stackprime-marketing-site/app/.env <<'EOF'
            NEXT_PUBLIC_SITE_URL=https://stackprimeconsulting.com.ng
            NEXT_PUBLIC_ASSETS_CDN_URL=
            EOF

            echo "Production environment file created."

      - name: Deploy marketing application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 25m
          script: |
            set -e

            cd /opt/stackprime-marketing-site/app

            echo "========================================"
            echo "Building marketing application..."
            echo "========================================"
            docker compose build --no-cache marketing-site

            echo "========================================"
            echo "Deploying marketing application..."
            echo "========================================"

            echo "Stopping existing marketing container..."
            docker stop stackprime-marketing-site 2>/dev/null || true

            echo "Removing existing marketing container..."
            docker rm -f stackprime-marketing-site 2>/dev/null || true

            echo "Starting new marketing container..."
            docker compose up -d --no-deps marketing-site

            echo "========================================"
            echo "Waiting for application health..."
            echo "========================================"

            HEALTHY=false

            for i in $(seq 1 36); do
              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                stackprime-marketing-site 2>/dev/null || echo "missing")

              echo "Health status: $STATUS — attempt $i/36"

              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                echo "Application is healthy."
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "Application became unhealthy."
                docker logs --tail 100 stackprime-marketing-site
                exit 1
              fi

              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Application failed to become healthy."
              docker logs --tail 100 stackprime-marketing-site
              exit 1
            fi

            echo "========================================"
            echo "Refreshing Nginx upstream DNS..."
            echo "========================================"

            docker restart stackprime-nginx

            sleep 5

            echo "Nginx restarted successfully."

            echo "========================================"
            echo "Checking internal application endpoint..."
            echo "========================================"

            docker exec stackprime-nginx \
              wget -qO- http://stackprime-marketing-site:3000/api/health

            echo

            echo "========================================"
            echo "Checking public HTTPS endpoint..."
            echo "========================================"

            for i in $(seq 1 12); do
              if curl -fsS https://stackprimeconsulting.com.ng/api/health; then
                echo
                echo "Public HTTPS endpoint is healthy."
                break
              fi

              echo "Public endpoint not ready — attempt $i/12"
              sleep 5
            done

      - name: Verify public health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e

            echo "Verifying public HTTPS health endpoint..."

            for i in {1..30}; do
              if curl -sf \
                --retry 2 \
                --retry-delay 2 \
                https://stackprimeconsulting.com.ng/api/health > /tmp/health-response.txt; then

                echo "✓ Health check passed."
                cat /tmp/health-response.txt
                echo
                exit 0
              fi

              echo "Attempt $i/30 — endpoint not ready yet..."
              sleep 2
            done

            echo "✗ Health check failed after 60 seconds."

            echo "===== Docker containers ====="
            docker ps -a

            echo "===== Marketing application logs ====="
            docker logs --tail 100 stackprime-marketing-site || true

            exit 1