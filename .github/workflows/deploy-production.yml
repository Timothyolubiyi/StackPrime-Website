name: Deploy — Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment bundle
        shell: bash
        run: |
          set -e

          rm -rf .deploy
          mkdir -p .deploy/docker

          cp -a docker/Dockerfile .deploy/docker/
          cp -a docker-compose.yml .deploy/
          cp -a marketing-site .deploy/

          echo "===== Deployment bundle ====="
          du -sh .deploy
          find .deploy -maxdepth 2 -type f | sort | head -50

      - name: Copy deployment bundle to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: ".deploy/*"
          target: "/opt/stackprime-marketing-site/app"
          port: 22
          overwrite: true
          timeout: 120s
          command_timeout: 25m
          strip_components: 1

      - name: Create production environment file
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e

            cat > /opt/stackprime-marketing-site/app/.env <<'EOF'
            NEXT_PUBLIC_SITE_URL=https://stackprimeconsulting.com.ng
            NEXT_PUBLIC_ASSETS_CDN_URL=
            NEXT_PUBLIC_VAS_API_URL=https://vas.stackprimeconsulting.com.ng
            NEXT_PUBLIC_SP_FAST_SPEEDTEST_API_URL=https://speedtest.stackprimeconsulting.com.ng
            EOF

            echo "Production environment file created."

      - name: Deploy marketing application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 25m
          script: |
           set -e

           cd /opt/stackprime-marketing-site/app

           echo "========================================"
           echo "Building marketing application..."
           echo "========================================"

           docker compose build --no-cache marketing-site

           echo "========================================"
           echo "Deploying marketing application..."
           echo "========================================"

           docker compose up -d --no-deps --force-recreate marketing-site

           echo "========================================"
           echo "Identifying marketing container..."
           echo "========================================"

           CID=$(docker compose ps -q marketing-site)

           if [ -z "$CID" ]; then
             echo "ERROR: Marketing container was not found."
             docker compose ps -a
             exit 1
           fi

           echo "Marketing container ID: $CID"

           echo "========================================"
           echo "Waiting for application health..."
           echo "========================================"

           HEALTHY=false

           for i in $(seq 1 36); do
             STATUS=$(docker inspect \
               --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
               "$CID")

             echo "Health status: $STATUS — attempt $i/36"

             if [ "$STATUS" = "healthy" ]; then
               HEALTHY=true
               echo "Application is healthy."
               break
             fi

             if [ "$STATUS" = "unhealthy" ]; then
               echo "Application became unhealthy."
               docker logs --tail 100 "$CID"
               exit 1
             fi

             sleep 5
           done

           if [ "$HEALTHY" != "true" ]; then
             echo "Application failed to become healthy."
             docker logs --tail 100 "$CID"
             exit 1
           fi

           echo "========================================"
           echo "Validating and reloading Nginx..."
           echo "========================================"

           docker exec stackprime-nginx nginx -t
           docker exec stackprime-nginx nginx -s reload

           echo "Nginx configuration validated and reloaded."

           echo "========================================"
           echo "Checking internal application endpoint..."
           echo "========================================"

           docker exec stackprime-nginx \
             wget -qO- http://stackprime-marketing-site:3000/api/health

           echo

           echo "========================================"
           echo "Checking public HTTPS endpoint..."
           echo "========================================"

           PUBLIC_HEALTHY=false

           for i in $(seq 1 12); do
             if curl -fsS https://stackprimeconsulting.com.ng/api/health; then
               echo
               PUBLIC_HEALTHY=true
               break
             fi

             echo "Public endpoint not ready — attempt $i/12"
             sleep 5
           done

           if [ "$PUBLIC_HEALTHY" != "true" ]; then
             echo "ERROR: Public HTTPS health check failed."
             docker compose ps -a
             docker logs --tail 100 "$CID"
             exit 1
           fi

           echo "Public HTTPS endpoint is healthy."

      - name: Verify public health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e

            cd /opt/stackprime-marketing-site/app

            echo "Verifying public HTTPS health endpoint..."

            for i in $(seq 1 30); do
              if curl -sf \
                --retry 2 \
                --retry-delay 2 \
                https://stackprimeconsulting.com.ng/api/health > /tmp/health-response.txt; then

                echo "✓ Health check passed."
                cat /tmp/health-response.txt
                echo
                exit 0
              fi

              echo "Attempt $i/30 — endpoint not ready yet..."
              sleep 2
            done

            echo "✗ Health check failed after 60 seconds."

            echo "===== Marketing Compose containers ====="
            docker compose ps -a

            echo "===== Marketing application logs ====="
            docker compose logs --tail 100 marketing-site || true

            exit 1
