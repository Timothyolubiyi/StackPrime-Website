name: SP SaaS - CI

on:
  pull_request:
    paths:
      - 'stackprime-phase3/sp-saas-platform/**'
      - '.github/workflows/sp-saas-ci.yml'
  push:
    branches: [main]
    paths:
      - 'stackprime-phase3/sp-saas-platform/**'
      - '.github/workflows/sp-saas-ci.yml'

permissions:
  contents: read

concurrency:
  group: sp-saas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API typecheck, build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: stackprime-phase3/sp-saas-platform/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sp
          POSTGRES_PASSWORD: sp
          POSTGRES_DB: sp_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sp -d sp_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sp:sp@localhost:5432/sp_saas_test?schema=public
      REDIS_URL: redis://localhost:6379/1
      APP_ORIGIN: http://localhost:5173
      API_PUBLIC_URL: http://localhost:4000
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      MFA_ENC_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stackprime-phase3/sp-saas-platform/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: API typecheck
        run: npm run typecheck

      - name: API build
        run: npm run build

      - name: Prepare test database
        run: |
          npx prisma migrate deploy
          npx prisma db execute --file prisma/sql/constraints.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/audit_immutable.sql --schema prisma/schema.prisma

      - name: API tests
        run: npm test -- --passWithNoTests

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: stackprime-phase3/sp-saas-platform/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stackprime-phase3/sp-saas-platform/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend production build
        run: npm run build

      - name: Validate frontend output
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "Frontend build validated."

  docker:
    name: API Docker image build
    runs-on: ubuntu-latest
    needs: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: stackprime-phase3/sp-saas-platform/api
          push: false
          tags: sp-saas-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max