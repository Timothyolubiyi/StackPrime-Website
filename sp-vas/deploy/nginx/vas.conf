# Place at nginx/conf.d/vas.conf on the shared droplet, alongside the
# marketing site's existing conf. Reuses the same Nginx container — no
# second reverse proxy needed.

server {
    listen 80;
    server_name vas.stackprimeconsulting.com.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name vas.stackprimeconsulting.com.ng;

    ssl_certificate     /etc/letsencrypt/live/vas.stackprimeconsulting.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vas.stackprimeconsulting.com.ng/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 2M;

    # Scans are I/O-bound (multiple outbound checks per request) — give
    # them more headroom than the marketing site's default proxy timeout.
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://sp-vas:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
