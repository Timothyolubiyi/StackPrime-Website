# SP VAS production Compose file.
#
# The Compose project is deployed independently from the marketing site.
# Production layout on the shared Droplet:
#
# /opt/sp-vas/
# ├── .env
# ├── deploy/docker-compose.yml
# └── app/service/
#
# The production .env is kept outside the Git-managed application source
# so deployments cannot accidentally delete or overwrite it.
#
# SP VAS connects to the existing shared_nginx_net so the existing
# marketing-site Nginx container can reverse-proxy to sp-vas:4001.

name: sp-vas

services:
  sp-vas:
    build:
      context: ../app/service
      dockerfile: Dockerfile

    container_name: sp-vas
    restart: unless-stopped

    env_file:
      - ../.env

    volumes:
      - sp-vas-data:/app/data
      - sp-vas-reports:/app/reports

    expose:
      - "4001"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - shared_nginx_net

volumes:
  sp-vas-data:
  sp-vas-reports:

networks:
  shared_nginx_net:
    external: true
