# Phase 3 stack for the 1 GB droplet. Every memory cap is a variable (see .env.example),
# so moving to the 2 GB plan is a config change, not a rewrite.
name: sp-saas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-32MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-30}
      - -c
      - wal_buffers=4MB
      - -c
      - max_wal_size=512MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: ${PG_MEM_LIMIT:-384m}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # volatile-ttl: only keys with a TTL are evicted. Everything we store (rate-limit counters,
    # session revocation entries) has a TTL, so nothing permanent can be dropped.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - volatile-ttl
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redisdata:/data
    mem_limit: ${REDIS_MEM_LIMIT:-192m}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    image: registry.digitalocean.com/${DO_REGISTRY_NAMESPACE}/sp-saas-api:${API_TAG}
    restart: unless-stopped
    env_file: .env.api
    environment:
      NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-192}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${API_MEM_LIMIT:-320m}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-dist:/srv/web:ro # React SPA build (step 7); empty until then
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  certbot-webroot:
