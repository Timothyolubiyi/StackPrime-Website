# HTTP: ACME challenges + redirect to HTTPS
server {
  listen 80;
  server_name app.stackprimeconsulting.com.ng;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.stackprimeconsulting.com.ng;

  ssl_certificate     /etc/letsencrypt/live/app.stackprimeconsulting.com.ng/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.stackprimeconsulting.com.ng/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 1m;

  # API (also serves agents and API-key users at /v1/*)
  location /v1/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location = /healthz { proxy_pass http://api:4000/healthz; }

  # React SPA (step 7)
  root /srv/web;
  index index.html;
  location / { try_files $uri /index.html; }
}
