name: Deploy — SP Fast Speed Test

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "deploy/**"
      - ".github/workflows/deploy-sp-fast-speedtest.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy source to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "service,deploy/docker-compose.yml,deploy/nginx/speedtest.conf"
          target: "/opt/sp-fast-speedtest/app"
          overwrite: true

      - name: Build and deploy backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -eu

            APP_DIR="/opt/sp-fast-speedtest"
            SOURCE_DIR="$APP_DIR/app"
            NGINX_CONF_DIR="/opt/stackprime-marketing-site/production/nginx/conf.d"

            test -f "$SOURCE_DIR/deploy/docker-compose.yml"
            test -f "$SOURCE_DIR/deploy/nginx/speedtest.conf"
            test -f "$SOURCE_DIR/service/Dockerfile"

            mkdir -p "$APP_DIR"
            mkdir -p "$NGINX_CONF_DIR"

            cd "$APP_DIR"
            cp "$SOURCE_DIR/deploy/docker-compose.yml" ./docker-compose.yml

            if [ -d "$SOURCE_DIR/service" ]; then
              rm -rf ./service
              cp -a "$SOURCE_DIR/service" ./service
            else
              echo "Service source directory is missing"
              exit 1
            fi

            if [ ! -f "$APP_DIR/.env" ]; then
              cat > "$APP_DIR/.env" <<'SP_FAST_SPEEDTEST_ENV'
            PORT=4002
            DATABASE_URL=file:/app/data/speedtest.db
            ALLOWED_ORIGINS=https://stackprimeconsulting.com.ng,https://www.stackprimeconsulting.com.ng
            SP_FAST_SPEEDTEST_ENV
              chmod 600 "$APP_DIR/.env"
            fi
            docker compose build sp-fast-speedtest
            docker compose up -d sp-fast-speedtest

            echo "Waiting for backend container..."
            sleep 5
            docker ps --filter name=sp-fast-speedtest

            echo "Checking backend health from inside its container..."
            docker exec sp-fast-speedtest wget -q -O- http://127.0.0.1:4002/api/health

      - name: Install Nginx virtual host and reload safely
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -eu

            SOURCE="/opt/sp-fast-speedtest/app/deploy/nginx/speedtest.conf"
            DEST="/opt/stackprime-marketing-site/production/nginx/conf.d/speedtest.conf"
            CERT_DIR="/opt/stackprime-marketing-site/production/nginx/certbot/conf/live/speedtest.stackprimeconsulting.com.ng"

            test -f "$SOURCE"
            test -f "$CERT_DIR/fullchain.pem"
            test -f "$CERT_DIR/privkey.pem"

            cp "$SOURCE" "$DEST"

            docker exec stackprime-nginx nginx -t
            docker exec stackprime-nginx nginx -s reload

      - name: Verify public HTTPS health endpoint
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            sleep 3

            for attempt in 1 2 3 4 5; do
              if curl -fsS --max-time 10 \
                https://speedtest.stackprimeconsulting.com.ng/api/health; then
                echo
                echo "Speed-test health check passed."
                exit 0
              fi
              sleep 3
            done

            echo "Health check failed."
            exit 1