# Reverse proxy for speedtest.stackprimeconsulting.com.ng
# Copied into the marketing site's nginx/conf.d/ directory on deploy (same
# pattern as sp-vas's vas.conf) — reuses the marketing site's Nginx
# container and its existing Certbot/TLS setup rather than running a
# second Nginx instance.

server {
    listen 80;
    server_name speedtest.stackprimeconsulting.com.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name speedtest.stackprimeconsulting.com.ng;

    ssl_certificate     /etc/letsencrypt/live/speedtest.stackprimeconsulting.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speedtest.stackprimeconsulting.com.ng/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Larger than sp-vas's 2M — this service accepts multi-megabyte upload
    # test payloads (capped server-side at 8MB per call; 10M gives headroom).
    client_max_body_size 10M;

    location / {
        proxy_pass http://sp-fast-speedtest:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamed, not buffered — buffering the full download-test payload
        # in Nginx before forwarding it would add latency on top of the
        # actual transfer time, skewing the speed measurement itself.
        proxy_buffering off;
        proxy_request_buffering off;

        # Generous timeouts — a visitor on a genuinely slow connection
        # downloading/uploading several MB should not get cut off mid-test.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/health {
        proxy_pass http://sp-fast-speedtest:4002/api/health;
        access_log off;
    }
}
